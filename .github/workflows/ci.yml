name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Truthcheck
        run: sh scripts/truthcheck.sh
      # Zed compiles extensions to WebAssembly; build the same artifact here.
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
